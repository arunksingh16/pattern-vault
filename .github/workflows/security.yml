name: Security Scans

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # needed to upload SARIF results

jobs:
  # ── 1. Secret scanning ──────────────────────────────────────────────────────
  gitleaks:
    name: "🔑 Gitleaks – secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so gitleaks can scan all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Dependency vulnerability scan ───────────────────────────────────────
  pip-audit:
    name: "📦 pip-audit – CVE scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --requirement <(pip install --dry-run -e . 2>&1 | grep "^Collecting" | awk '{print $2}') || true
        # Soft-fail on first run; harden to fail once a baseline is clean:
        # run: pip-audit -r <(pip show $(pip install -e . -q && pip freeze) 2>/dev/null)

      - name: Audit via pyproject.toml
        run: |
          pip install -e . --quiet
          pip-audit

  # ── 3. Python static security analysis ────────────────────────────────────
  bandit:
    name: "🛡️ Bandit – SAST"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[sarif]

      - name: Run bandit
        run: |
          bandit -r src/ -c pyproject.toml \
            --format sarif \
            --output bandit-results.sarif \
            --exit-zero        # don't fail the step; let the SARIF upload surface issues

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif

  # ── 4. Pre-commit hooks (runs all hooks including gitleaks + detect-secrets) ─
  pre-commit:
    name: "✅ pre-commit hooks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1
